name: Harness Android

permissions:
  contents: read

concurrency:
  group: harness-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_dispatch:
    inputs:
      device_api_level:
        description: 'Android API level for the emulator'
        required: false
        default: '35'
        type: string
      device_profile:
        description: 'Device profile'
        required: false
        default: 'pixel_7'
        type: string
      avd_name:
        description: 'AVD name'
        required: false
        default: 'Pixel_8_API_35'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harness-android.yml'
      - 'example/android/**'
      - 'example/__tests__/**'
      - 'example/src/**'
      - 'example/App.tsx'
      - 'example/index.js'
      - 'example/index.business-runtime.ts'
      - 'example/jest.harness.config.mjs'
      - 'example/rn-harness.config.mjs'
      - 'example/metro.config.js'
      - 'example/babel.config.js'
      - 'example/package.json'
      - 'packages/*/cpp/**'
      - 'packages/*/android/**'
      - 'packages/*/src/**'
      - 'packages/*/nitrogen/generated/shared/**'
      - 'packages/*/nitrogen/generated/android/**'
      - 'packages/*/package.json'
      - 'bun.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/harness-android.yml'
      - 'example/android/**'
      - 'example/__tests__/**'
      - 'example/src/**'
      - 'example/App.tsx'
      - 'example/index.js'
      - 'example/index.business-runtime.ts'
      - 'example/jest.harness.config.mjs'
      - 'example/rn-harness.config.mjs'
      - 'example/metro.config.js'
      - 'example/babel.config.js'
      - 'example/package.json'
      - 'packages/*/cpp/**'
      - 'packages/*/android/**'
      - 'packages/*/src/**'
      - 'packages/*/nitrogen/generated/shared/**'
      - 'packages/*/nitrogen/generated/android/**'
      - 'packages/*/package.json'
      - 'bun.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'

env:
  # Device configuration - can be overridden by workflow_dispatch inputs.
  # AVD_NAME is read by example/rn-harness.config.mjs so the harness reuses the
  # emulator that android-emulator-runner boots (instead of creating its own).
  DEVICE_API_LEVEL: ${{ github.event.inputs.device_api_level || '35' }}
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: ${{ github.event.inputs.device_profile || 'pixel_7' }}
  AVD_NAME: ${{ github.event.inputs.avd_name || 'Pixel_8_API_35' }}
  AVD_DISK_SIZE: 1G
  AVD_HEAP_SIZE: 1G
  HARNESS_DEBUG: 1

jobs:
  harness_android:
    name: Harness Tests Android
    runs-on: ubuntu-latest
    # Backstop: the harness E2E run + emulator should finish well within this.
    # Without it, a stuck emulator/teardown would run to GitHub's 6h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - name: Restore Gradle/CMake cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            example/android/.gradle
            example/android/app/.cxx
          key: ${{ runner.os }}-gradle-${{ env.DEVICE_ARCH }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.DEVICE_ARCH }}-
            ${{ runner.os }}-gradle-
      - name: Build Android app
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.DEVICE_ARCH }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVICE_API_LEVEL }}-${{ env.DEVICE_ARCH }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.DEVICE_API_LEVEL }}
          arch: ${{ env.DEVICE_ARCH }}
          profile: ${{ env.DEVICE_PROFILE }}
          disk-size: ${{ env.AVD_DISK_SIZE }}
          heap-size: ${{ env.AVD_HEAP_SIZE }}
          force-avd-creation: false
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      # android-emulator-runner boots (and tears down) the emulator. The harness
      # then reuses the already-running emulator (rn-harness.config.mjs targets
      # AVD_NAME), so it never owns the emulator lifecycle and never issues the
      # blocking `adb emu kill` on teardown. `-no-snapshot-save` keeps shutdown
      # clean and fast.
      - name: Run Harness E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: example
          api-level: ${{ env.DEVICE_API_LEVEL }}
          arch: ${{ env.DEVICE_ARCH }}
          force-avd-creation: false
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "./android/app/build/outputs/apk/debug/app-debug.apk"
            bun run test:harness --harnessRunner android

      - name: Upload harness crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-crash-reports-android
          path: example/.harness/crash-reports/**/*
          if-no-files-found: ignore

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop
